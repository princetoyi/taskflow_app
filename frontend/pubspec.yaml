name: taskflow_app
description: TaskFlow mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  get_it: ^8.0.3
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^4.0.1
  logger: ^1.3.0
  provider: ^6.0.6
  cupertino_icons: ^1.0.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.5.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - .env
