# .github/workflows/ci.yml
# Runs on every push to develop and every pull request into main.
# Lints the code and runs tests to catch issues before they merge.

name: TaskFlow CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: taskflow_app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: taskflow_app/backend
        run: |
          pip install flake8
          flake8 app --max-line-length=100 --exclude=__pycache__

      - name: Run tests
        working-directory: taskflow_app/backend
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATH }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          pip install pytest
          pytest tests/ -v