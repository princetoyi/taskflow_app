name: taskflow_app
description: TaskFlow mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^14.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  get_it: ^8.0.3
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^4.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  logger: ^1.3.0
  provider: ^6.0.6
  cupertino_icons: ^1.0.2
  json_annotation: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  json_serializable: ^6.5.0
  hive_generator: ^1.1.1

flutter:
  uses-material-design: true
  assets:
    - .env
